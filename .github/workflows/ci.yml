# 最小 CI：跑这台机器的全部回归 + fixture 重生成比对（零依赖，不需要 npm install）。
# - selftest.mjs：盲中继自身行为（配对/回收/上限/闸门，14 条）
# - protocol_conformance.mjs：协议 fixture 对照（漂移即红，15 条）
# - notify-selftest.mjs：**现役** v7 通知服务的行为（三方法/离线留存/ack/TTL/上限/
#   长轮询/limit 边界/断连/撤销唤醒/无二次写，条数由脚本自己打印）
# - notify-persist-selftest.mjs：写盘失败必须回滚且不假装成功（3 条）
# - fixture 重生成：用 fixtures/generator 重新生成并与已提交的 protocol.fixtures.json
#   逐字节比对，防止「改了生成器/忘了重生成 fixture」的漂移。
# 任一红 = 这次改动破坏了既有承诺或线格式，不许合。
#
# ⚠️ 这两条 notify 自测**必须留在 CI 里**：它们是 v7 唯一的产品链路
# （外部系统 publish → 客户端 pull → ack）的服务端判据，而主仓的 E2E 层
# 在本机跑不了 CI 那一步（要 release 二进制 + GUI 会话）。删掉这两步 =
# 现役通知服务回到「只能靠人记得跑」的状态（2026-11-18 审查结论）。
# ⚠️ 旧 v6 webhook.mjs 及其两套自测已彻底删除：仓库里只保留 v7 这一套通知服务的判据，
# 不会有任何非现役的测试档混进来造「服务端 N 条全绿」的假数。
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: selftest + notify + protocol conformance + fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 与 Dockerfile 的 node:22-alpine 同代；下限是 18
      - name: Selftest（盲中继行为 14 条）
        run: node selftest.mjs
      - name: Notify selftest（现役 v7 通知服务）
        run: node notify-selftest.mjs
      - name: Notify 写盘失败回滚自测（3 条）
        run: node notify-persist-selftest.mjs
      - name: Protocol conformance（fixture 对照 15 条）
        run: node protocol_conformance.mjs
      - name: Fixture 重新生成并逐字节比对
        run: |
          cargo run --locked --quiet --manifest-path fixtures/generator/Cargo.toml > /tmp/protocol.fixtures.json
          cmp protocol.fixtures.json /tmp/protocol.fixtures.json
