[package]
name = "relayvec"
version = "0.1.0"
edition = "2021"

# 版本钉死与 gosslan 主仓 Cargo.lock 一致（973b4df3 时点），
# 保证生成的向量与客户端真实实现逐字节同源。
[dependencies]
serde_json = "=1.0.151"
sha2 = "=0.10.9"
ed25519-dalek = "=2.2.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "=0.10.1"
base64 = "=0.22.1"
